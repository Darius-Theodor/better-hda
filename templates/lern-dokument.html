<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TITEL</title>
<style>
html { color-scheme: light only; }
body { margin: 0; padding: 32px 24px; background: #EBEBEB; color: #000000; font: 400 16px/1.5 Arial, Helvetica, sans-serif; }
main { max-width: 68ch; margin: 0 auto; padding: 56px 64px 48px; background: #FFFFFF; border: 1px solid rgba(89,89,89,.25); }
h1, h2, h3 { font-weight: 700; line-height: 1.25; margin: 0 0 8px; }
h1 { font-size: 24px; }
h2 { font-size: 20px; margin-top: 48px; }
h3 { font-size: 16px; margin-top: 24px; }
p, ul, ol, table, .box { margin: 0 0 16px; }
ul, ol { padding-left: 24px; }
li { margin: 0 0 4px; }
a { color: #1F3864; text-decoration: underline; }
.secondary { color: #595959; font-size: 14px; }
.box { background: #EDEDED; padding: 16px; }
table { border-collapse: collapse; font-size: 15px; }
th { font-weight: 700; text-align: left; padding: 4px 16px 4px 8px; background: #EDEDED; }
td { padding: 4px 16px 4px 8px; border-bottom: 1px solid rgba(89,89,89,.25); vertical-align: top; }
code, pre { font-family: Consolas, Menlo, monospace; }
pre { margin: 0 0 16px; padding: 16px; background: #E0E0E0; border: 1px solid rgba(89,89,89,.25); font-size: 15px; line-height: 1.25; white-space: pre-wrap; }
img { display: block; max-width: 100%; height: auto; margin: 0 0 16px; }
@media print { body { padding: 0; background: #FFFFFF; } main { padding: 0; border: 0; } }
@media (max-width: 720px) { body { padding: 0; } main { padding: 32px 24px; border: 0; } }
</style>
</head>
<body>
<main>
<h1>TITEL</h1>
<p class="secondary">Kurs (Dozent), Stand TT.MM.JJJJ. Quellen: Dateinamen aus moodle/files.</p>
<!-- Inhalt: Absätze, h2 nur über Blöcken ab etwa 150 Wörtern, Tabellen für Stufen oder
     Vergleiche, pre für Code, .box für Prüfungsfragen mit guter Antwort. Kein weiteres CSS. -->
</main>
</body>
</html>
